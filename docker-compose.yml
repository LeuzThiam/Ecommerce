services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Intercepte les emails envoyés par Identity.Api (confirmation, reset mot de passe) sans
  # nécessiter de vrai serveur SMTP - interface web sur http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  identity.api:
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=IdentityDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      PublicBaseUrl: "http://localhost:5000"
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__UseSsl: "false"
      Smtp__FromAddress: noreply@ecommerce.local
      Smtp__FromName: Ecommerce
    ports:
      - "5138:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      mailpit:
        condition: service_started

  catalog.api:
    build:
      context: .
      dockerfile: src/Services/Catalog/Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=CatalogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SecretKey: ${JWT_SECRET_KEY}
    ports:
      - "5223:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  ordering.api:
    build:
      context: .
      dockerfile: src/Services/Ordering/Ordering.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OrderingDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Services__CatalogApi: "http://catalog.api:8080"
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
    ports:
      - "5087:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5000:8080"
    depends_on:
      - identity.api
      - catalog.api
      - ordering.api

  web:
    build:
      context: .
      dockerfile: src/Web/Ecommerce.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Gateway__BaseUrl: "http://gateway:8080"
    ports:
      - "5001:8080"
    depends_on:
      - gateway

volumes:
  sqlserver_data:
